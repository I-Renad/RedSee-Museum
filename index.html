<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حكاية مرساة | متحف البحر الأحمر</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>body{margin:0;background:#082f38;color:#edf2e8;font:16px Arial;text-align:center}header,.info{padding:20px}h1,h2{color:#e4bd79}a-scene{height:55vh;width:100%}button{padding:11px;margin:5px;background:#d8bb80;border:0;border-radius:5px}#hint{padding:12px;color:#f4deb1}.answer{padding:12px;min-height:40px}</style></head>
<body><header><small>RED SEA MUSEUM · جدة</small><h1>حكاية مرساة من البحر الأحمر</h1><p>وجّهي الكاميرا إلى صورة الهدف لتظهر المرساة والمرشد البحّار.</p><button id="start">ابدئي التجربة</button></header><div id="hint">وجّهي الكاميرا نحو صورة الهدف</div>
<a-scene id="scene" mindar-image="imageTargetSrc: assets/targets.mind; autoStart:false; uiScanning:no" embedded vr-mode-ui="enabled:false"><a-camera look-controls="enabled:false"></a-camera><a-entity mindar-image-target="targetIndex:0">
<a-cylinder position="0 0 0" radius=".06" height=".8" color="#b68a50"></a-cylinder><a-torus position="0 .45 0" radius=".1" radius-tubular=".025" color="#d6b476"></a-torus><a-cylinder position="0 .25 0" rotation="0 0 90" radius=".03" height=".6" color="#d6b476"></a-cylinder><a-cone position="-.28 -.3 0" rotation="0 0 110" radius-bottom=".16" radius-top=".025" height=".38" color="#b68a50"></a-cone><a-cone position=".28 -.3 0" rotation="0 0 -110" radius-bottom=".16" radius-top=".025" height=".38" color="#b68a50"></a-cone>
<a-cylinder position=".5 .02 0" radius=".1" height=".32" color="#efe2c6"></a-cylinder><a-sphere position=".5 .25 0" radius=".1" color="#9b6542"></a-sphere><a-cone position=".5 .4 0" radius-bottom=".13" radius-top=".02" height=".12" color="#d6b476"></a-cone><a-text value="المرشد البحّار" position=".1 -.58 0" align="center" color="#fff" width="1.4"></a-text></a-entity></a-scene>
<section class="info"><h2>اسألي المرشد</h2><button data-key="wood">نوع الخشب</button><button data-key="salt">مقاومة الملوحة</button><button data-key="anchor">عن المرساة</button><p id="answer" class="answer">المعلومات توضيحية إلى أن نضيف مصدرًا موثوقًا عن قطعة محددة.</p><input id="q" placeholder="اكتبي سؤالك"><button id="ask">إرسال</button></section>
<footer>نموذج أولي طلابي · معلومات المرساة تحتاج توثيقًا قبل اعتمادها</footer>
<script>const answers={wood:"خشب الساج مجرد مثال افتراضي هنا. نحتاج مصدرًا عن المرساة المحددة قبل تأكيد نوع الخشب.",salt:"تختلف مقاومة الخشب للماء والملوحة حسب نوعه ومعالجته؛ سنضيف المعلومة بعد توثيقها.",anchor:"هذا نموذج توضيحي لمرساة بحرية، ولا يصف حتى الآن قطعة معتمدة من مجموعة المتحف."};document.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>answer.textContent=answers[b.dataset.key]);ask.onclick=()=>{let s=q.value;answer.textContent=/خشب|مادة|wood/i.test(s)?answers.wood:/ملح|ماء|salt|water/i.test(s)?answers.salt:answers.anchor};document.querySelector("#start").onclick=()=>scene.systems["mindar-image-system"].start().catch(()=>hint.textContent="تعذّر تشغيل الكاميرا؛ افتحي الصفحة عبر HTTPS واسمحي بالوصول للكاميرا.");document.querySelector("#scene").addEventListener("targetFound",()=>hint.hidden=true);</script></body></html>
